services:
  llm-proxy:
    build:
      context: .
      dockerfile: Dockerfile
#    image: ghcr.io/knopka87/proxy-llm:main
#    pull_policy: always
    env_file:
      - .env
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_DETECT_MODEL: ${GEMINI_DETECT_MODEL:-gemini-2.0-flash-lite}
      GEMINI_PARSE_MODEL: ${GEMINI_PARSE_MODEL:-gemini-2.5-flash}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_DETECT_MODEL: ${OPENROUTER_DETECT_MODEL:-google/gemini-2.5-flash-lite}
      OPENROUTER_PARSE_MODEL: ${OPENROUTER_PARSE_MODEL:-openai/gpt-4.1-mini}
      OPENROUTER_HINT_MODEL: ${OPENROUTER_HINT_MODEL:-openai/gpt-4.1-mini}
      OPENROUTER_CHECK_MODEL: ${OPENROUTER_CHECK_MODEL:-openai/gpt-4.1-mini}
      OPENROUTER_ANALOGUE_MODEL: ${OPENROUTER_ANALOGUE_MODEL:-}
      LLM_PROXY_API_KEY: ${LLM_PROXY_API_KEY:?LLM_PROXY_API_KEY is required}
      LLM_PROXY_ALLOWED_CLIENT_CIDRS: ${LLM_PROXY_ALLOWED_CLIENT_CIDRS:?LLM_PROXY_ALLOWED_CLIENT_CIDRS is required}
      LLM_PROXY_TRUSTED_PROXY_CIDRS: ${LLM_PROXY_TRUSTED_PROXY_CIDRS:-}
      PORT: ${PORT:-8000}
      PROMPT_DIR: /app/prompts
      TEMPLATES_DIR: /app/templates
    ports:
      - "${LLM_PROXY_BIND_ADDRESS:-127.0.0.1}:8000:8000"
